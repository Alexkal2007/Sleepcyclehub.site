let lang = 'en';

function renderStatic(){
  const t = I18N[lang];
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(t[key] !== undefined) el.innerHTML = t[key];
  });
  document.getElementById('sections').innerHTML = t.sections.map(s =>
    `<div class="panel"><h2>${s[0]}</h2><p>${s[1]}</p></div>`).join('');
  document.getElementById('cookie-table-body').innerHTML = t.cookieTable.map(r =>
    `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  document.getElementById('html-root').lang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('btn-el').classList.toggle('active', lang==='el');
}

function setLang(l){ 
  lang = l; 
  renderStatic(); 
  if (typeof window.reRecalcCanvas === 'function') window.reRecalcCanvas();
}

renderStatic();

// --- starfield ---
(function(){
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = Math.max(document.body.scrollHeight, window.innerHeight);
    stars = Array.from({length: Math.floor((canvas.width*canvas.height)/22000)}, () => ({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*1.3 + 0.2,
      p: Math.random()*Math.PI*2,
      s: Math.random()*0.02 + 0.005
    }));
  }
  window.reRecalcCanvas = resize;

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const st of stars){
      st.p += st.s;
      const a = 0.35 + 0.5*Math.abs(Math.sin(st.p));
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(234,232,247,${a})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
})();
</script>
