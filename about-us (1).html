<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us — sleep.cycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0a0e28; --bg-2:#12183f;
    --card:rgba(255,255,255,0.045); --card-border:rgba(255,255,255,0.09);
    --ink:#eae8f7; --ink-muted:#9498ba;
    --gold:#f0c674; --gold-dim:rgba(240,198,116,0.35); --lav:#b6ade8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(182,173,232,0.10), transparent 60%),
      radial-gradient(ellipse 50% 40% at 85% 10%, rgba(240,198,116,0.07), transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 55%, #0a0e28 100%);
    color:var(--ink); font-family:'Manrope', sans-serif; min-height:100vh;
  }
  .wrap{max-width:760px; margin:0 auto; padding:56px 24px 80px; position:relative; z-index:1;}
  nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:40px;}
  .brand{font-family:'Fraunces',serif; font-weight:700; font-size:20px; letter-spacing:-0.01em; text-decoration:none; color:var(--ink);}
  .brand span{color:var(--gold);}
  .lang-toggle{display:flex; background:rgba(0,0,0,0.25); border-radius:10px; padding:4px; gap:2px;}
  .lang-toggle button{border:none; background:transparent; color:var(--ink-muted); font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; padding:7px 14px; border-radius:7px; cursor:pointer;}
  .lang-toggle button.active{background:var(--gold); color:#241a05;}
  h1{font-family:'Fraunces', serif; font-weight:600; font-size:clamp(28px, 4.5vw, 42px); line-height:1.1; margin:0 0 8px;}
  .lede{color:var(--ink-muted); margin:0 0 40px; line-height:1.6;}
  .panel{background:var(--card); border:1px solid var(--card-border); border-radius:20px; padding:30px; margin-bottom:18px;}
  .panel h2{font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:0 0 12px; color:var(--gold);}
  .panel p{color:var(--ink-muted); line-height:1.7; font-size:15px; margin:0 0 14px;}
  .panel p:last-child{margin-bottom:0;}
  .back-link{display:inline-block; margin-top:10px; color:var(--lav); font-size:14px; text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
  footer{text-align:center; color:var(--ink-muted); font-size:12.5px; margin-top:44px; display:flex; gap:18px; justify-content:center; flex-wrap:wrap;}
  footer a{color:var(--ink-muted); text-decoration:none;}
  footer a:hover{color:var(--lav);}
  @media (max-width:520px){ .panel{padding:22px;} nav{flex-direction:column; gap:14px; align-items:flex-start;} }

  #stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <nav>
    <a class="brand" href="kyklos-ypnou-v3.html">sleep<span>.cycle</span></a>
    <div class="lang-toggle">
      <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
      <button id="btn-el" onclick="setLang('el')">ΕΛ</button>
    </div>
  </nav>

  <h1 data-i18n="h1">About Us</h1>
  <p class="lede" data-i18n="lede">Who's behind sleep.cycle, and why it exists.</p>

  <div id="sections"></div>

</div>

<script>
const I18N = {
en: {
  h1: 'About Us',
  lede: "Who's behind sleep.cycle, and why it exists.",
  back: '← Back to home',
  sections: [
    ['Our mission',
      "sleep.cycle exists to make one small piece of sleep science easy to act on: that when you wake up matters as much as how long you slept. Most of us set an alarm around a number of hours rather than around the body's own rhythm, and end up waking up mid-cycle, groggy, more often than we need to. This site turns the 90-minute sleep cycle into a simple, practical tool — pick a bedtime or a wake-up time, and get back a short list of moments that land you between cycles instead of in the middle of one."],
    ['What the calculator actually does',
      "The tool counts backward or forward from the time you give it in blocks of roughly 90 minutes, the average length of a full sleep cycle, and adds a short buffer for the time it typically takes to actually fall asleep. It then highlights the options that add up to 5 or 6 complete cycles, since that range lines up with the amount of sleep most adults are recommended to get in a night. Nothing about your input is sent anywhere — every calculation happens directly in your browser."],
    ['Our approach',
      "We built this to be useful without being invasive. There's no sign-up, no account, no tracking of your sleep habits over time, and no data collection tied to the times you enter. We also don't dress this up as medical advice: sleep cycle length varies from person to person and night to night, so we treat the numbers here as a helpful estimate, not a diagnosis or a prescription."],
    ['Who we are',
      "sleep.cycle is an independent, small-scale project built by people interested in sleep science and simple, honest web tools — not a hospital, a clinic, or a research institution. Where we reference general sleep science (cycle length, sleep stages, age-based sleep recommendations), we're summarizing widely published, publicly available research rather than presenting original studies of our own."],
    ['Get in touch',
      "Questions, corrections, or ideas for the calculator are always welcome. If you spot something that looks inaccurate, or have a suggestion for how the tool could be more useful, reach out through the contact details listed on our Terms of Use page."],
  ]
},
el: {
  h1: 'Σχετικά με εμάς',
  lede: 'Ποιοι φτιάξαμε το sleep.cycle, και γιατί υπάρχει.',
  back: '← Πίσω στην αρχική',
  sections: [
    ['Ο σκοπός μας',
      "Το sleep.cycle υπάρχει για να κάνει εύκολο να αξιοποιήσεις ένα μικρό αλλά χρήσιμο κομμάτι της επιστήμης του ύπνου: ότι το πότε ξυπνάς έχει σχεδόν την ίδια σημασία με το πόσο κοιμήθηκες. Οι περισσότεροι βάζουμε ξυπνητήρι με βάση έναν αριθμό ωρών και όχι με βάση τον φυσικό ρυθμό του σώματος, με αποτέλεσμα να ξυπνάμε στη μέση ενός κύκλου πιο συχνά απ' όσο χρειάζεται. Αυτή η σελίδα μετατρέπει τον κύκλο ύπνου των 90 λεπτών σε ένα απλό, πρακτικό εργαλείο — διάλεξε μια ώρα ύπνου ή αφύπνισης και πάρε πίσω μια σύντομη λίστα στιγμών που σε αφήνουν ανάμεσα σε κύκλους αντί στη μέση ενός."],
    ['Τι κάνει πραγματικά ο υπολογιστής',
      "Το εργαλείο μετράει προς τα πίσω ή προς τα εμπρός από την ώρα που δίνεις, σε διαστήματα περίπου 90 λεπτών —τη μέση διάρκεια ενός πλήρους κύκλου ύπνου— και προσθέτει έναν μικρό χρόνο-«μαξιλάρι» για το διάστημα που συνήθως χρειάζεται κάποιος για να πάρει τον ύπνο. Στη συνέχεια ξεχωρίζει τις επιλογές που αντιστοιχούν σε 5 ή 6 πλήρεις κύκλους, αφού αυτό το εύρος ταιριάζει με τον ύπνο που συνιστάται συνήθως για τους περισσότερους ενήλικες. Τίποτα από όσα εισάγεις δεν στέλνεται πουθενά — όλος ο υπολογισμός γίνεται μέσα στον browser σου."],
    ['Η προσέγγισή μας',
      "Το φτιάξαμε ώστε να είναι χρήσιμο χωρίς να είναι παρεμβατικό. Δεν υπάρχει εγγραφή, δεν υπάρχει λογαριασμός, δεν καταγράφονται οι συνήθειες ύπνου σου με την πάροδο του χρόνου, ούτε συλλέγονται δεδομένα συνδεδεμένα με τις ώρες που εισάγεις. Επίσης δεν το παρουσιάζουμε ως ιατρική συμβουλή: η διάρκεια του κύκλου ύπνου διαφέρει από άνθρωπο σε άνθρωπο και από νύχτα σε νύχτα, οπότε αντιμετωπίζουμε τους αριθμούς εδώ ως χρήσιμη εκτίμηση, όχι ως διάγνωση ή συνταγή."],
    ['Ποιοι είμαστε',
      "Το sleep.cycle είναι ένα ανεξάρτητο, μικρής κλίμακας project φτιαγμένο από ανθρώπους που ενδιαφέρονται για την επιστήμη του ύπνου και τα απλά, ειλικρινή εργαλεία ιστού — όχι νοσοκομείο, κλινική ή ερευνητικό ίδρυμα. Όπου αναφερόμαστε σε γενική επιστήμη ύπνου (διάρκεια κύκλου, στάδια ύπνου, συστάσεις ανά ηλικία), συνοψίζουμε ευρέως δημοσιευμένη, δημόσια διαθέσιμη έρευνα και όχι δικές μας πρωτότυπες μελέτες."],
    ['Επικοινωνία',
      "Ερωτήσεις, διορθώσεις ή ιδέες για τον υπολογιστή είναι πάντα ευπρόσδεκτες. Αν εντοπίσεις κάτι που φαίνεται ανακριβές, ή έχεις πρόταση για το πώς να γίνει πιο χρήσιμο το εργαλείο, επικοινώνησε μέσω των στοιχείων επικοινωνίας που αναφέρονται στη σελίδα Όροι Χρήσης."],
  ]
}
};

let lang = 'en';
function renderStatic(){
  const t = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(t[key] !== undefined) el.innerHTML = t[key];
  });
  document.getElementById('sections').innerHTML = t.sections.map(s =>
    `<div class="panel"><h2>${s[0]}</h2><p>${s[1]}</p></div>`).join('');
  document.getElementById('html-root').lang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('btn-el').classList.toggle('active', lang==='el');
}
function setLang(l){ lang = l; renderStatic(); }
renderStatic();

// --- starfield ---
(function(){
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = document.body.scrollHeight;
    stars = Array.from({length: Math.floor((canvas.width*canvas.height)/22000)}, () => ({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*1.3 + 0.2,
      p: Math.random()*Math.PI*2,
      s: Math.random()*0.02 + 0.005
    }));
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const st of stars){
      st.p += st.s;
      const a = 0.35 + 0.5*Math.abs(Math.sin(st.p));
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(234,232,247,${a})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
})();
</script>
</body>
</html>
